<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDEX | Financial Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/recharts@2.10.3/umd/Recharts.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .glass-panel { background: linear-gradient(145deg, rgba(30,41,59,0.9), rgba(15,23,42,0.95)); border: 1px solid rgba(255,255,255,0.05); }
        .text-gradient { background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, LineChart, Line, PieChart, Pie, Cell, Legend } = Recharts;

        // --- MOCK DATA (Replace with Google Sheets Fetch later) ---
        const MOCK_DATA = {
            accounts: [
                { id: 1, name: "Chase Checking", type: "bank", balance: 4500.50, institution: "Chase" },
                { id: 2, name: "Ally Savings", type: "bank", balance: 12500.00, institution: "Ally" },
                { id: 3, name: "Amex Gold", type: "credit", balance: -1250.40, institution: "Amex" },
                { id: 4, name: "Discover It", type: "credit", balance: -450.00, institution: "Discover" },
                { id: 5, name: "SoFi Personal Loan", type: "loan", balance: -8500.00, institution: "SoFi" },
                { id: 6, name: "Fidelity 401k", type: "investment", balance: 45000.00, institution: "Fidelity" },
                { id: 7, name: "Robinhood Brokerage", type: "investment", balance: 12300.50, institution: "Robinhood" }
            ],
            investments: [
                { date: 'Jan', value: 50000 }, { date: 'Feb', value: 52000 },
                { date: 'Mar', value: 51500 }, { date: 'Apr', value: 54000 },
                { date: 'May', value: 56000 }, { date: 'Jun', value: 57300 }
            ],
            esppOfferings: [
                { id: 1, company: "TechCorp Inc.", ticker: "TECH", discount: 15, lookback: true, startDate: "2023-10-01", endDate: "2023-12-31", purchaseDate: "2024-01-15", maxContrib: 25000, contributed: 18500, status: "Active" },
                { id: 2, company: "Global Systems", ticker: "GLBL", discount: 10, lookback: false, startDate: "2023-07-01", endDate: "2023-09-30", purchaseDate: "2023-10-15", maxContrib: 20000, contributed: 20000, status: "Purchased" }
            ],
            esppLoans: [
                { id: 1, offeringId: 2, pullDate: "2023-09-15", amount: 20000, interestRate: 6.5, interestCharge: 325, sharesBought: 450, purchasePrice: 44.44, salePrice: 52.00, soldDate: "2023-10-16", netProfit: 2905, status: "Paid Off" },
                { id: 2, offeringId: 1, pullDate: "2023-12-15", amount: 18500, interestRate: 6.5, interestCharge: 300, sharesBought: 0, purchasePrice: 0, salePrice: 0, soldDate: null, netProfit: 0, status: "Pending Purchase" }
            ]
        };

        // --- COMPONENTS ---

        const StatCard = ({ title, value, subtext, icon, color }) => (
            <div className="card p-6 rounded-xl shadow-lg hover:shadow-blue-500/10 transition-all duration-300">
                <div className="flex justify-between items-start">
                    <div>
                        <p className="text-slate-400 text-sm font-medium">{title}</p>
                        <h3 className="text-2xl font-bold text-white mt-1">{value}</h3>
                        {subtext && <p className={`text-xs mt-2 ${color === 'green' ? 'text-emerald-400' : color === 'red' ? 'text-rose-400' : 'text-slate-400'}`}>{subtext}</p>}
                    </div>
                    <div className={`p-3 rounded-lg bg-${color}-500/10 text-${color}-400`}>
                        <i className={`fas ${icon} text-xl`}></i>
                    </div>
                </div>
            </div>
        );

        const AccountRow = ({ account }) => {
            const isPositive = account.balance >= 0;
            return (
                <div className="flex justify-between items-center p-4 border-b border-slate-700/50 last:border-0 hover:bg-slate-800/50 transition-colors">
                    <div className="flex items-center gap-4">
                        <div className={`w-10 h-10 rounded-full flex items-center justify-center ${account.type === 'bank' ? 'bg-blue-500/20 text-blue-400' : account.type === 'credit' ? 'bg-rose-500/20 text-rose-400' : 'bg-emerald-500/20 text-emerald-400'}`}>
                            <i className={`fas ${account.type === 'bank' ? 'fa-building-columns' : account.type === 'credit' ? 'fa-credit-card' : 'fa-chart-line'}`}></i>
                        </div>
                        <div>
                            <h4 className="font-semibold text-slate-200">{account.name}</h4>
                            <p className="text-xs text-slate-500">{account.institution}</p>
                        </div>
                    </div>
                    <span className={`font-mono font-medium ${isPositive ? 'text-emerald-400' : 'text-rose-400'}`}>
                        {isPositive ? '+' : ''}{account.balance.toLocaleString('en-US', { style: 'currency', currency: 'USD' })}
                    </span>
                </div>
            );
        };

        const HeySparty = () => {
            const [offerings, setOfferings] = useState(MOCK_DATA.esppOfferings);
            const [loans, setLoans] = useState(MOCK_DATA.esppLoans);

            const totalPulled = loans.reduce((acc, loan) => acc + loan.amount, 0);
            const totalInterest = loans.reduce((acc, loan) => acc + loan.interestCharge, 0);
            const totalProfit = loans.reduce((acc, loan) => acc + (loan.netProfit || 0), 0);
            const activeLoans = loans.filter(l => l.status !== 'Paid Off').length;

            return (
                <div className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <StatCard title="Total PLOC Pulled" value={`$${totalPulled.toLocaleString()}`} subtext="Across all quarters" icon="fa-hand-holding-dollar" color="blue" />
                        <StatCard title="Total Interest Cost" value={`$${totalInterest.toLocaleString()}`} subtext="Cost of leverage" icon="fa-percent" color="rose" />
                        <StatCard title="Net Profit (After Fees)" value={`$${totalProfit.toLocaleString()}`} subtext="Realized Gains" icon="fa-sack-dollar" color="emerald" />
                        <StatCard title="Active Loans" value={activeLoans} subtext="Pending settlement" icon="fa-clock" color="amber" />
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* Current Offerings */}
                        <div className="card rounded-xl p-6">
                            <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                                <i className="fas fa-briefcase text-blue-400"></i> Active Offerings
                            </h3>
                            <div className="space-y-4">
                                {offerings.map(offering => (
                                    <div key={offering.id} className="bg-slate-800/50 p-4 rounded-lg border border-slate-700">
                                        <div className="flex justify-between mb-2">
                                            <span className="font-bold text-white">{offering.company} ({offering.ticker})</span>
                                            <span className={`px-2 py-1 rounded text-xs font-bold ${offering.status === 'Active' ? 'bg-blue-500/20 text-blue-400' : 'bg-emerald-500/20 text-emerald-400'}`}>{offering.status}</span>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2 text-sm text-slate-400">
                                            <div>Discount: <span className="text-white font-mono">{offering.discount}%</span></div>
                                            <div>Lookback: <span className={offering.lookback ? "text-emerald-400" : "text-slate-500"}>{offering.lookback ? "Yes" : "No"}</span></div>
                                            <div>Contributed: <span className="text-white font-mono">${offering.contributed.toLocaleString()}</span></div>
                                            <div>Purchase Date: <span className="text-white">{offering.purchaseDate}</span></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Loan History Table */}
                        <div className="card rounded-xl p-6 overflow-hidden">
                            <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                                <i className="fas fa-history text-amber-400"></i> Loan & Profit History
                            </h3>
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm text-left">
                                    <thead className="text-xs text-slate-400 uppercase bg-slate-800/50">
                                        <tr>
                                            <th className="px-4 py-3">Date</th>
                                            <th className="px-4 py-3">Amount</th>
                                            <th className="px-4 py-3">Interest</th>
                                            <th className="px-4 py-3">Net Profit</th>
                                            <th className="px-4 py-3">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {loans.map(loan => (
                                            <tr key={loan.id} className="border-b border-slate-700/50 hover:bg-slate-800/30">
                                                <td className="px-4 py-3 text-slate-300">{loan.pullDate}</td>
                                                <td className="px-4 py-3 font-mono text-white">${loan.amount.toLocaleString()}</td>
                                                <td className="px-4 py-3 font-mono text-rose-400">-${loan.interestCharge}</td>
                                                <td className={`px-4 py-3 font-mono font-bold ${loan.netProfit > 0 ? 'text-emerald-400' : 'text-slate-500'}`}>
                                                    {loan.netProfit > 0 ? '+' : ''}${loan.netProfit.toLocaleString()}
                                                </td>
                                                <td className="px-4 py-3">
                                                    <span className={`px-2 py-1 rounded text-xs ${
                                                        loan.status === 'Paid Off' ? 'bg-emerald-500/20 text-emerald-400' : 
                                                        loan.status === 'Pending Purchase' ? 'bg-amber-500/20 text-amber-400' : 'bg-blue-500/20 text-blue-400'
                                                    }`}>
                                                        {loan.status}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [data, setData] = useState(MOCK_DATA);
            const [netWorth, setNetWorth] = useState(0);
            const [liquidCash, setLiquidCash] = useState(0);
            const [debt, setDebt] = useState(0);

            useEffect(() => {
                let nw = 0;
                let cash = 0;
                let d = 0;
                data.accounts.forEach(acc => {
                    nw += acc.balance;
                    if (acc.type === 'bank') cash += acc.balance;
                    if (acc.balance < 0) d += Math.abs(acc.balance);
                });
                setNetWorth(nw);
                setLiquidCash(cash);
                setDebt(d);
            }, [data]);

            const COLORS = ['#38bdf8', '#818cf8', '#34d399', '#f472b6', '#fbbf24'];

            return (
                <div className="min-h-screen pb-20">
                    {/* Header */}
                    <header className="sticky top-0 z-50 glass-panel border-b border-slate-700/50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">T</div>
                                <h1 className="text-xl font-bold tracking-tight text-white">TDEX <span className="text-slate-500 font-normal text-sm ml-2">Personal Finance OS</span></h1>
                            </div>
                            <div className="flex items-center gap-4">
                                <button className="text-slate-400 hover:text-white transition-colors"><i className="fas fa-cog"></i></button>
                                <div className="w-8 h-8 rounded-full bg-slate-700 border border-slate-600"></div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                        
                        {/* Net Worth Summary */}
                        <section>
                            <h2 className="text-2xl font-bold text-white mb-6">Financial Overview</h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <StatCard title="Net Worth" value={`$${netWorth.toLocaleString()}`} subtext="+2.4% this month" icon="fa-wallet" color="blue" />
                                <StatCard title="Liquid Cash" value={`$${liquidCash.toLocaleString()}`} subtext="Available for investment" icon="fa-coins" color="emerald" />
                                <StatCard title="Total Debt" value={`$${debt.toLocaleString()}`} subtext="Including Credit & Loans" icon="fa-file-invoice-dollar" color="rose" />
                            </div>
                        </section>

                        {/* Main Grid */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            
                            {/* Left Column: Accounts & Charts */}
                            <div className="lg:col-span-2 space-y-8">
                                
                                {/* Hey Sparty Section */}
                                <section>
                                    <div className="flex items-center gap-3 mb-6">
                                        <div className="w-2 h-8 bg-amber-500 rounded-full"></div>
                                        <h2 className="text-2xl font-bold text-white">Hey Sparty <span className="text-sm font-normal text-slate-400 ml-2">ESPP & PLOC Tracker</span></h2>
                                    </div>
                                    <HeySparty />
                                </section>

                                {/* Investment Growth Chart */}
                                <section className="card rounded-xl p-6">
                                    <h3 className="text-lg font-bold text-white mb-4">Investment Growth</h3>
                                    <div className="h-64 w-full">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <LineChart data={data.investments}>
                                                <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                                                <XAxis dataKey="date" stroke="#94a3b8" />
                                                <YAxis stroke="#94a3b8" />
                                                <Tooltip contentStyle={{backgroundColor: '#1e293b', borderColor: '#334155', color: '#fff'}} />
                                                <Line type="monotone" dataKey="value" stroke="#38bdf8" strokeWidth={3} dot={{r: 4, fill: '#38bdf8'}} />
                                            </LineChart>
                                        </ResponsiveContainer>
                                    </div>
                                </section>
                            </div>

                            {/* Right Column: Account List */}
                            <div className="space-y-8">
                                <section className="card rounded-xl p-6">
                                    <h3 className="text-lg font-bold text-white mb-4">Accounts</h3>
                                    <div className="space-y-1">
                                        {data.accounts.map(account => (
                                            <AccountRow key={account.id} account={account} />
                                        ))}
                                    </div>
                                    <button className="w-full mt-4 py-3 rounded-lg border border-dashed border-slate-600 text-slate-400 hover:text-white hover:border-slate-400 transition-all text-sm font-medium">
                                        + Connect New Account
                                    </button>
                                </section>

                                <section className="card rounded-xl p-6">
                                    <h3 className="text-lg font-bold text-white mb-4">Asset Allocation</h3>
                                    <div className="h-48 w-full relative">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <PieChart>
                                                <Pie data={[
                                                    { name: 'Cash', value: liquidCash },
                                                    { name: 'Investments', value: 57300 },
                                                    { name: 'Other', value: 15000 }
                                                ]} innerRadius={40} outerRadius={70} paddingAngle={5} dataKey="value">
                                                    {COLORS.map((color, index) => <Cell key={`cell-${index}`} fill={color} />)}
                                                </Pie>
                                                <Tooltip contentStyle={{backgroundColor: '#1e293b', borderColor: '#334155', color: '#fff'}} />
                                            </PieChart>
                                        </ResponsiveContainer>
                                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                            <span className="text-xs text-slate-400">Distribution</span>
                                        </div>
                                    </div>
                                    <div className="mt-4 space-y-2">
                                        <div className="flex justify-between text-xs text-slate-400"><span>Cash</span><span className="text-blue-400">20%</span></div>
                                        <div className="flex justify-between text-xs text-slate-400"><span>Investments</span><span className="text-indigo-400">65%</span></div>
                                        <div className="flex justify-between text-xs text-slate-400"><span>Other</span><span className="text-emerald-400">15%</span></div>
                                    </div>
                                </section>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
